[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "24"
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
[[headers]]
for = "/*"
[headers.values]
Referrer-Policy = "no-referrer"
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"

[[headers]]
for = "/disponibilidad/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "no-store"
